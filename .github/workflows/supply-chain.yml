name: Container Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC (Cosign keyless + AWS)
  contents: read
  packages: write   # required for ghcr.io push

env:
  ECR_REPOSITORY: devops-demo-app
  IMAGE_NAME: devops-demo-app

jobs:
  build-sign-push:
    name: Build · Sign · SBOM · Push
    runs-on: ubuntu-latest

    outputs:
      ecr_image: ${{ steps.meta.outputs.ecr_image }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install tooling ────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      # ── AWS credentials via OIDC ───────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build image ────────────────────────────────────────────────
      - name: Set image tags
        id: meta
        run: |
          ECR_IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          ECR_LATEST="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          GHCR_LATEST="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
          echo "ecr_image=${ECR_IMAGE}" >> $GITHUB_OUTPUT
          echo "ecr_latest=${ECR_LATEST}" >> $GITHUB_OUTPUT
          echo "ghcr_image=${GHCR_IMAGE}" >> $GITHUB_OUTPUT
          echo "ghcr_latest=${GHCR_LATEST}" >> $GITHUB_OUTPUT

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: apps/demo-app
          push: true
          tags: |
            ${{ steps.meta.outputs.ecr_image }}
            ${{ steps.meta.outputs.ecr_latest }}
            ${{ steps.meta.outputs.ghcr_image }}
            ${{ steps.meta.outputs.ghcr_latest }}

      # ── Cosign keyless signing ─────────────────────────────────────
      - name: Sign ECR image (keyless via Sigstore)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.meta.outputs.ecr_image }}@${{ steps.build.outputs.digest }}"

      - name: Sign ghcr.io image (keyless via Sigstore)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ steps.meta.outputs.ghcr_image }}@${{ steps.build.outputs.digest }}"

      # ── Syft SBOM generation ───────────────────────────────────────
      - name: Generate SBOM with Syft
        run: |
          syft \
            "${{ steps.meta.outputs.ecr_image }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json=sbom.spdx.json

      - name: Attach SBOM to ECR image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attach sbom \
            --sbom sbom.spdx.json \
            "${{ steps.meta.outputs.ecr_image }}@${{ steps.build.outputs.digest }}"

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      # ── Verify signature against Rekor ────────────────────────────
      - name: Verify ECR image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ steps.meta.outputs.ecr_image }}@${{ steps.build.outputs.digest }}"

      - name: Verify ghcr.io image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ steps.meta.outputs.ghcr_image }}@${{ steps.build.outputs.digest }}"
